# A REGUA CONTRA O MUNDO REAL -- gabarito externo, escrito antes de rodar.
#
# 🚨 O QUE ELA MEDE, E O QUE ELA NAO MEDE. Ler antes de olhar qualquer numero.
#
# Nenhum destes repositorios tem `veredito.yml`. Logo a rodada tem `read_file` e
# `grep` e mais nada: sem app de pe, sem prova diferencial, sem banco. A R2
# limita a severidade a MEDIA e **PROVADO por artefato e' inalcancavel aqui**.
#
#   ✅ mede  se a lente LEVANTA suspeita no lugar certo (cobertura)
#   ✅ mede  se o parecer descarta COM MOTIVO em vez de calar (qualidade)
#   ✅ mede  se ele fica quieto em PR de rotina (falso positivo)
#   🚫 NAO mede  poder de prova -- isso e' a bancada, que tem app e gabarito
#
# Dizer "achou N de M defeitos" a partir daqui seria numero sem gabarito, que e'
# proibido no CLAUDE.md. O numero honesto e' por coluna, e as tres colunas tem
# significados diferentes.
#
# ---------------------------------------------------------------------------
# 🚨 CONTAMINACAO: o modelo pode ja conhecer o conserto.
#
# Os quatro defeitos do grupo A foram INTRODUZIDOS antes do corte de
# conhecimento dos modelos. O que decide contaminacao, porem, e' a data do
# CONSERTO: e' o texto do conserto que diz "isto era um bug". Tres dos quatro
# foram consertados em jun/jul de 2026, depois do corte.
#
# O `poetry#9304` e' a excecao, e ele fica de proposito: **e' a sonda de
# contaminacao**. Se o desempenho nele for visivelmente melhor que nos outros
# tres, isso e' sinal de memoria e nao de deteccao.
#
# ⚠️ E o vies tem direcao conhecida: contaminacao so' AJUDA o grupo A. Entao o
# numero do grupo A e' um TETO, e o do grupo B (falso positivo) e' o robusto.
#
# ---------------------------------------------------------------------------
# 🚫 EXCLUIDO DE PROPOSITO: pallets/flask#6095.
#
# Ja foi revisado em 17/08, e foi nele que a R3 foi decidida e ajustada. Medir
# de novo o caso em que o instrumento foi calibrado nao produz informacao --
# produz o proprio reflexo, que e' o erro dos 94 arbitros.

versao: 1
escrito_em: 2026-08-20
