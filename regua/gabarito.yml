      # PR fui eu, por `commits/2ad5f0c/pulls`.
      referencia_visivel: false
      porque_invisivel: "o conserto culpa o commit 2ad5f0c, nao o PR"
    nota: >-
      🚨 A SONDA DE ESCALA, e esta' aqui de proposito. 23 arquivos, e a fila ja
      registra 220s/acusacao no next.js. Se sair inconclusivo por orcamento,
      isso mede o NOSSO limite de escala -- nao a deteccao. Sem um caso assim,
      a taxa de inconclusivo do conjunto pareceria defeito nosso em toda linha.

  - pr: https://github.com/python-poetry/poetry/pull/9304
    titulo: "Move to native tags gathering"
    tamanho: "+37/-61 em 7 arquivos"
    merge: 2024-04-17
    onde: src/poetry/utils/env/virtual_env.py
    defeito: >-
      passar a coletar as tags de plataforma do venv do proprio Poetry faz
      instalar wheel da plataforma errada quando o ambiente alvo difere (Python
      32 bits no Windows, aarch64 emulado em x86_64).
    procedencia:
      conserto: https://github.com/python-poetry/poetry/pull/10361
      consertado_em: 2025-05-04
      pos_corte: false
      # 🚨 AQUI A FERRAMENTA E' QUE E' CEGA, e a distincao importa. O corpo do
      # #10361 diz "#9304 introduced a regression" com todas as letras, mas o
      # #9304 esta' LOCKED e nenhum evento `cross-referenced` foi gravado. A
      # referencia existe no texto e nao existe na timeline.
      #
      # E' por isso que a conferencia declara por entrada em vez de deduzir do
      # silencio: "nao achei" tem duas causas -- nao ha o que achar (scrapy) e
      # nao consigo achar (aqui) -- e trata-las igual e' a R3 de 17/08 de novo.
      referencia_visivel: false
      porque_invisivel: "o PR esta' LOCKED; a citacao existe no corpo do conserto, o evento nao"
    nota: >-
      🚨 A SONDA DE CONTAMINACAO. Unico com conserto ANTERIOR ao corte. Ir
      melhor aqui que nos outros tres e' sinal de memoria, nao de deteccao.

