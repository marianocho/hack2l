grupo_a:                     # PRs que INTRODUZIRAM defeito, confirmado depois
  - pr: https://github.com/aio-libs/aiohttp/pull/12130
    titulo: "Replace unintentional except BaseException with except Exception"
    tamanho: "+4/-4 em 3 arquivos"
    merge: 2026-02-23
    onde: aiohttp/client_proto.py
    defeito: >-
      estreitar `except BaseException` para `except Exception` em
      `ResponseHandler.data_received` deixou de fechar o transporte quando o
      parser e' interrompido por CancelledError/SystemExit -- a conexao
      dessincronizada volta para o pool keep-alive e e' reusada.
    procedencia:
      conserto: https://github.com/aio-libs/aiohttp/pull/12798
      consertado_em: 2026-06-04
      pos_corte: true
      # O conserto cita "#12130" no corpo, e o GitHub gravou o evento
      # `cross-referenced`. Serve de controle positivo da conferencia.
      referencia_visivel: true
    nota: >-
      o caso mais valioso do conjunto: 4 linhas trocadas, revisor humano passa
      batido, e o titulo do PR afirma que a mudanca e' intencional e segura.

  - pr: https://github.com/celery/celery/pull/8903
    titulo: "Fix recursive result parents on group in middle of chain"
    tamanho: "+24/-0 em 3 arquivos"
    merge: 2024-03-10
    onde: celery/canvas.py
    defeito: >-
      resetar `prev_task`/`prev_res` depois de promover `group | task` a chord
      quebra o encadeamento quando ha dois grupos consecutivos: o `as_tuple()`
      da cadeia perde os `GroupResult` filhos.
    procedencia:
      conserto: https://github.com/celery/celery/pull/10408
      consertado_em: 2026-07-15
      pos_corte: true
      referencia_visivel: true
    nota: "PR que CONSERTA um bug e introduz outro -- padrao comum e dificil."

  - pr: https://github.com/scrapy/scrapy/pull/6540
    titulo: "Remove build_from_settings() and deprecate from_settings() code"
    tamanho: "+565/-273 em 23 arquivos"
    merge: 2024-11-14
    onde: scrapy/pipelines/images.py
    defeito: >-
      o refactor deixou de aplicar `IMAGES_STORE_S3_ACL` e
      `IMAGES_STORE_GCS_ACL`; os stores de imagem passaram a usar o ACL do
      store de arquivos.
    procedencia:
      conserto: https://github.com/scrapy/scrapy/pull/7614
      consertado_em: 2026-06-15
      pos_corte: true
      # 🚨 FALSO no fato, nao na ferramenta: o conserto culpa o COMMIT
