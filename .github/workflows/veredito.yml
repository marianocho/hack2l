# O Veredito revisando um PR, na CI, com o parecer voltando como comentario.
#
# 🚨 POR QUE ACTION E NAO BOT HOSPEDADO
#
# O produto precisa RODAR o app do cliente. Um bot hospedado exigiria clonar o
# codigo e subir o stack de cada cliente na nossa infra -- pesadelo de seguranca
# para dois socios, e o comprador que mais precisa e' justo quem nao deixa o
# codigo sair. A CI dele ja faz checkout de base e head, ja sobe o app, ja roda
# testes: a Action inverte a restricao em vantagem.
#
# ⚠️ ESTE workflow roda a versao SEM app: `read_file` e `grep`, que sao as duas
# ferramentas ESSENCIAIS do pre-voo. E' o caminho de um PR de terceiro, e desde
# 17/08 ele e' honesto -- as ferramentas que o projeto nao declara RECUSAM
# dizendo isso, em vez de falhar e contaminar o veredito. Sem prova ponta a
# ponta, a R2 limita a severidade a MEDIA.
#
# Para ganhar as ferramentas todas, o repositorio revisado precisa de um
# `veredito.yml` na raiz (como um Dockerfile) e de um passo que suba o app.

name: Veredito

on:
  # O PR deste proprio repositorio.
  pull_request:
    types: [opened, synchronize, reopened]
  # E qualquer PR, a mao -- e' o modo de demonstrar sem depender de abrir PR.
  workflow_dispatch:
    inputs:
      pr:
        description: "URL do PR (vazio = o PR deste repositorio que disparou)"
        required: false
        type: string
      top_n:
        description: "Quantas acusacoes vao ao advogado (o passo caro)"
        required: false
        default: "2"
        type: string
      postar:
        description: "Comentar no PR de verdade (desmarcado = so' imprime)"
        required: false
        default: true
        type: boolean

# Sem isto o comentario da 403. `contents: read` e' o checkout.
permissions:
  contents: read
  pull-requests: write

# Push novo cancela a rodada anterior do mesmo PR: cada rodada custa dinheiro, e
# revisar um commit que ja foi substituido e' pagar para medir o passado.
concurrency:
  group: veredito-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    # 🚫 PR vindo de FORK nao recebe secrets, e o GITHUB_TOKEN dele e' somente
    # leitura -- e' politica do GitHub, nao configuracao nossa. A rodada
    # comecaria sem a chave da API e morreria no meio, gastando minuto de CI
    # para nao dizer nada. Melhor nem comecar.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      # 🚨 Antes de gastar: chave ausente falha AQUI, com a causa dita. Sem este
      # passo o erro aparece no meio da rodada, depois dos promotores, e le como
      # defeito do produto em vez de secret faltando.
      #
      # 🚨 E A CAUSA DITA TEM QUE SER A CAUSA -- 20/08. A versao anterior dizia
      # "nao esta nos secrets DESTE repositorio" para qualquer valor vazio. Mas
      # `gh secret set` le o valor do STDIN, e quando o stdin nao e' um terminal
      # ele grava STRING VAZIA sem reclamar: o secret passa a existir, aparece
      # no `gh secret list` com data e tudo, e chega vazio no runner.
      #
      # Aconteceu de verdade: o operador leu "nao esta nos secrets", foi la',
      # criou o secret -- e a rodada seguinte falhou no MESMO passo com a MESMA
      # mensagem, que continuava dizendo que faltava o que ja estava la'.
      # Guarda que acusa a causa errada manda consertar a coisa errada, e e' o
      # padrao de bug da casa aplicado ao texto do alarme.
      #
      # 🚫 O valor nunca e' impresso. O Actions mascara secret no log, mas a
      # classificacao aqui e' deliberadamente grosseira -- vazia / curta demais
      # / prefixo estranho -- porque ela precisa caber no log publico de um
      # repositorio de demonstracao.
      - name: Conferir a chave
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          limpa="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          if [ -z "$limpa" ]; then
            echo "::error::ANTHROPIC_API_KEY chegou VAZIA no runner."
            echo "Duas causas possiveis, e o log nao distingue as duas:"
            echo "  1. o secret nao existe neste repositorio; ou"
            echo '  2. ele existe com valor vazio -- "gh secret set" le o valor'
            echo "     do stdin e grava string vazia quando o stdin nao e' um"
            echo "     terminal, e ai o secret aparece na lista mas chega vazio."
            echo "Confira com:  gh secret list -R \$GITHUB_REPOSITORY"
            echo "Se ele JA aparece na lista, o caso e' o (2): regrave o valor"
            echo "pela web (Settings -> Secrets and variables -> Actions) ou com"
            echo "  gh secret set ANTHROPIC_API_KEY -R \$GITHUB_REPOSITORY < arquivo-com-a-chave"
            exit 1
          fi
          # Não valida formato a fundo de propósito: prefixo de chave é coisa do
          # provedor e muda sem avisar. Só o bastante para pegar aspas coladas
          # no paste e arquivo com lixo, que sao os enganos que sobram.
          case "$limpa" in
            sk-*) ;;
            *) echo "::warning::a chave nao comeca com 'sk-'. Se a rodada falhar"
               echo "com 401, suspeite de aspas ou espaco colados no valor." ;;
          esac

      - name: Revisar o PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # O mesmo caminho de token do entrada.py. Serve para a API do GitHub
          # resolver o merge-base e para clonar repositorio privado.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOP_N: ${{ inputs.top_n || '2' }}
        run: |
          PR="${{ inputs.pr }}"
          if [ -z "$PR" ]; then
            PR="${{ github.event.pull_request.html_url }}"
          fi
          echo "revisando $PR"
          python revisa_pr.py "$PR"

      - name: Comentar no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ inputs.pr }}"
          if [ -z "$PR" ]; then
            PR="${{ github.event.pull_request.html_url }}"
          fi
          # `workflow_dispatch` com a caixa desmarcada so' imprime. O evento de
          # `pull_request` sempre posta: quem instalou o workflow no repositorio
          # ja disse que quer o comentario.
          if [ "${{ inputs.postar }}" = "false" ]; then
            python posta_parecer.py "$PR"
          else
            python posta_parecer.py "$PR" --postar
          fi

      # 🚨 O rastro sobe SEMPRE, inclusive quando a rodada falha -- e' quando ele
      # mais vale. `chamadas.json`, os artefatos de prova, o escopo gravado antes
      # do laco caro: e' o que responde auditabilidade, custo e latencia de uma
      # vez, e o que permite reajustar o parecer sem re-executar o advogado.
      - name: Guardar o rastro da rodada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: veredito-rodada
          path: saidas/rodadas/
          retention-days: 14
          if-no-files-found: warn
